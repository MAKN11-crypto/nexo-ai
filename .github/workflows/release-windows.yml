name: Publicar instalador de Nexo para Windows

on:
  push: {}
  workflow_dispatch:
    inputs:
      release_tag:
        description: Etiqueta de versión que coincide con package.json
        required: true
        default: v0.9.1
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/MAKN10' && (
        contains(github.event.head_commit.added, 'package.json') ||
        contains(github.event.head_commit.modified, 'package.json') ||
        contains(github.event.head_commit.added, 'package-lock.json') ||
        contains(github.event.head_commit.modified, 'package-lock.json')
      ))
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Elegir etiqueta de versión
        id: release
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) {
            $version = node -p "require('./package.json').version"
            $tag = "v$version"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Instalar dependencias
        run: npm ci

      - name: Crear instalador, ZIP y manifiesto de actualización
        run: npm run package:win
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Publicar los instaladores y el manifiesto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Nexo ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
