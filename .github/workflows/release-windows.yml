name: Publicar instalador de Nexo para Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear instalador, ZIP y manifiesto de actualización
        run: npm run package:win
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publicar los instaladores y el manifiesto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
