name: Publicar instaladores de Bit by Orbit para Windows y Mac

on:
  push:
    branches:
      - MAKN10
  workflow_dispatch:
    inputs:
      release_tag:
        description: Etiqueta de versión que coincide con package.json
        required: true
        default: v0.11.0
        type: string

permissions:
  contents: read

jobs:
  determine-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.check.outputs.release_tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Comprobar si falta publicar esta versión
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const requested = context.eventName === 'workflow_dispatch' ? context.payload.inputs?.release_tag : '';
            const tag = requested || `v${version}`;
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('release_tag', tag);
            core.setOutput('should_release', context.eventName === 'workflow_dispatch' || !exists ? 'true' : 'false');

  release-windows:
    needs: determine-release
    if: needs.determine-release.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear instalador, ZIP y manifiesto de actualización
        run: npm run package:win
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.determine-release.outputs.release_tag }}

      - name: Publicar los instaladores y el manifiesto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-release.outputs.release_tag }}
          name: Bit by Orbit ${{ needs.determine-release.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  release-macos:
    needs: [determine-release, release-windows]
    if: needs.determine-release.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear app para Mac Apple Silicon
        run: npm run package:mac
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.determine-release.outputs.release_tag }}

      - name: Publicar instalador y actualización para Mac
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-release.outputs.release_tag }}
          name: Bit by Orbit ${{ needs.determine-release.outputs.release_tag }}
          files: |
            dist/*.dmg
            dist/*mac*.zip
            dist/latest-mac.yml
